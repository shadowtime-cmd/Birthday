<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* ================= BASE STYLES & ATMOSPHERE ================= */
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1a1525 0%, #0a0812 100%);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient floating balloons */
        #bg-decorations {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .balloon {
            position: absolute; font-size: 3em;
            animation: floatUp 7s infinite linear; opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(-10deg); }
            100% { transform: translateY(-20vh) rotate(10deg); }
        }

        /* Happy Birthday Banner */
        .banner {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10;
        }
        .flag {
            width: 40px; height: 50px;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background: #ff4081;
            animation: swing 2s infinite ease-in-out alternate;
            transform-origin: top center;
        }
        .flag:nth-child(even) { background: #00e676; animation-delay: 0.5s; }
        .flag:nth-child(3n) { background: #00b0ff; animation-delay: 1s; }
        @keyframes swing {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* Buttons */
        .btn {
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            color: white; border: none; padding: 15px 30px; font-size: 1.1em;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            position: relative; z-index: 20;
        }
        .btn:hover { transform: scale(1.05); }

        /* ================= SCENE SETUP ================= */
        #cake-page {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 20px;
            position: relative; z-index: 1;
        }

        /* The 3D Table */
        .table-container {
            position: relative; width: 600px; height: 400px;
            margin-top: 50px;
        }
        .table-surface {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 500px; height: 120px;
            background: radial-gradient(ellipse at center, #4e342e 0%, #211512 100%);
            border-radius: 50%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), inset 0 5px 10px rgba(255,255,255,0.1);
            z-index: 2;
        }

        /* Cake SVG & Shaking Animation */
        .cake-wrapper {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 350px;
            z-index: 3;
        }
        .tremble {
            animation: violentShake 0.1s infinite !important;
        }
        @keyframes violentShake {
            0% { transform: translateX(-50%) translate(3px, 2px); }
            25% { transform: translateX(-50%) translate(-3px, -2px); }
            50% { transform: translateX(-50%) translate(4px, 0px); }
            75% { transform: translateX(-50%) translate(-4px, 3px); }
            100% { transform: translateX(-50%) translate(0px, -2px); }
        }

        /* Kitties (Hidden initially via Y transform) */
        #kitties {
            position: absolute; bottom: 60px; left: 50%;
            transform: translate(-50%, 150px); /* Hidden deep inside cake */
            display: flex; gap: 20px; z-index: 4;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }
        #kitties.rise-up {
            transform: translate(-50%, 0);
            opacity: 1;
        }
        
        /* Blinking Eyes */
        .eye {
            animation: blink 4s infinite;
            transform-origin: center;
        }
        @keyframes blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        /* Canvas for physics chunks */
        #physics-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Ambient Decor -->
    <div id="bg-decorations"></div>
    <div class="banner" id="banner"></div>

    <div id="cake-page">
        <h1 style="z-index: 20; color: #ff9a9e; font-size: 3em; margin-bottom: 5px;">Make a Wish!</h1>
        <p style="z-index: 20; color: #aaa; margin-bottom: 20px;">The candles are burning. Click to cut.</p>
        
        <button class="btn" id="cut-btn" onclick="startCinematicCut()">Cut the Cake 🔪</button>

        <div class="table-container">
            <!-- Table Surface -->
            <div class="table-surface"></div>
            
            <!-- Explosion Physics Canvas -->
            <canvas id="physics-canvas"></canvas>

            <div class="cake-wrapper" id="cake-wrapper">
                
                <!-- The Kitties (Layered behind the front crust) -->
                <svg id="kitties" viewBox="0 0 200 100" width="200" height="100">
                    <!-- Kitty 1 -->
                    <g transform="translate(40, 50)">
                        <!-- Body -->
                        <path d="M-25,50 C-25,-10 25,-10 25,50" fill="#f4a261" />
                        <!-- Head -->
                        <circle cx="0" cy="0" r="25" fill="#f4a261" />
                        <!-- Ears -->
                        <polygon points="-15,-15 -25,-35 -5,-22" fill="#e76f51"/>
                        <polygon points="15,-15 25,-35 5,-22" fill="#e76f51"/>
                        <!-- Eyes -->
                        <ellipse class="eye" cx="-10" cy="-5" rx="3" ry="5" fill="#222"/>
                        <ellipse class="eye" cx="10" cy="-5" rx="3" ry="5" fill="#222"/>
                        <!-- Nose/Mouth -->
                        <circle cx="0" cy="5" r="2" fill="#e76f51"/>
                        <!-- Paws holding the cake edge -->
                        <circle cx="-18" cy="30" r="8" fill="#e76f51"/>
                        <circle cx="18" cy="30" r="8" fill="#e76f51"/>
                    </g>
                    <!-- Kitty 2 -->
                    <g transform="translate(160, 50)">
                        <!-- Body -->
                        <path d="M-25,50 C-25,-10 25,-10 25,50" fill="#e0e0e0" />
                        <!-- Head -->
                        <circle cx="0" cy="0" r="25" fill="#e0e0e0" />
                        <!-- Ears -->
                        <polygon points="-15,-15 -25,-35 -5,-22" fill="#b0bec5"/>
                        <polygon points="15,-15 25,-35 5,-22" fill="#b0bec5"/>
                        <!-- Eyes -->
                        <ellipse class="eye" cx="-10" cy="-5" rx="3" ry="5" fill="#222"/>
                        <ellipse class="eye" cx="10" cy="-5" rx="3" ry="5" fill="#222"/>
                        <!-- Nose -->
                        <circle cx="0" cy="5" r="2" fill="#ff80ab"/>
                        <!-- Paws -->
                        <circle cx="-18" cy="30" r="8" fill="#b0bec5"/>
                        <circle cx="18" cy="30" r="8" fill="#b0bec5"/>
                    </g>
                </svg>

                <!-- The Cake Structure -->
                <svg viewBox="0 0 300 350" width="100%" height="100%">
                    <!-- BOTTOM LAYER (Stays intact) -->
                    <g id="cake-bottom" transform="translate(0, 50)" style="z-index: 5; position: relative;">
                        <!-- Back inside wall of bottom layer (gives 3D depth when top blows off) -->
                        <ellipse cx="150" cy="180" rx="110" ry="30" fill="#883b4d" />
                        <!-- Front crust -->
                        <path d="M40,180 C40,180 40,240 40,240 C40,260 260,260 260,240 C260,240 260,180 260,180 C260,200 40,200 40,180 Z" fill="#ba68c8" />
                        <path d="M40,180 C40,160 260,160 260,180 C260,200 40,200 40,180 Z" fill="#ab47bc" opacity="0.4"/>
                    </g>

                    <!-- TOP LAYERS (These will vanish instantly on explosion) -->
                    <g id="cake-top-half" transform="translate(0, 50)">
                        <!-- Top Cake Tier -->
                        <path d="M70,110 C70,90 230,90 230,110 L230,170 C230,190 70,190 70,170 Z" fill="#ff80ab" />
                        <!-- Frosting Drips -->
                        <path d="M70,110 Q85,130 100,115 Q115,135 130,115 Q145,135 160,115 Q175,135 190,115 Q205,135 220,115 Q230,125 230,110 C230,90 70,90 70,110 Z" fill="#ffffff" />
                        
                        <!-- Auto-generated Candles will go here -->
                        <g id="candles-group"></g>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Background Setup ---
        const bgDeco = document.getElementById('bg-decorations');
        const balloonColors = ['🎈', '✨', '🎈', '🎉'];
        for (let i = 0; i < 12; i++) {
            let b = document.createElement('div');
            b.className = 'balloon';
            b.innerText = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            b.style.left = `${Math.random() * 95}vw`;
            b.style.animationDuration = `${5 + Math.random() * 5}s`;
            b.style.animationDelay = `${Math.random() * 5}s`;
            bgDeco.appendChild(b);
        }

        const banner = document.getElementById('banner');
        for(let i = 0; i < 15; i++) {
            let flag = document.createElement('div');
            flag.className = 'flag';
            banner.appendChild(flag);
        }

        // --- 2. Lots of Candles ---
        const candleGroup = document.getElementById('candles-group');
        for(let i = 0; i < 12; i++) {
            // Distribute candles along an arc to look 3D
            let x = 80 + (i * 12.5);
            let y = 100 + Math.sin(i * 0.6) * 15; 
            
            candleGroup.innerHTML += `
                <g transform="translate(${x}, ${y})">
                    <rect x="-4" y="-20" width="8" height="20" rx="2" fill="#00e676" />
                    <!-- Flickering Flame -->
                    <g>
                        <animateTransform attributeName="transform" type="scale" values="1 1; 1.3 1.3; 1 1" dur="${0.1 + Math.random()*0.2}s" repeatCount="indefinite" />
                        <path d="M0,-22 Q-4,-30 0,-35 Q4,-30 0,-22 Z" fill="#ffea00" />
                        <path d="M0,-24 Q-2,-28 0,-32 Q2,-28 0,-24 Z" fill="#ff6d00" />
                    </g>
                </g>
            `;
        }

        // --- 3. Cinematic Cut Sequence ---
        let isCut = false;
        function startCinematicCut() {
            if (isCut) return;
            isCut = true;
            document.getElementById('cut-btn').style.display = 'none';

            const wrapper = document.getElementById('cake-wrapper');
            const topHalf = document.getElementById('cake-top-half');
            const kitties = document.getElementById('kitties');

            // 1. Violent Tremble (Oggy style)
            wrapper.classList.add('tremble');

            // 2. Wait 1.5 seconds, then EXPLODE
            setTimeout(() => {
                wrapper.classList.remove('tremble');
                
                // Hide the top half immediately
                topHalf.style.display = 'none';

                // Trigger Physics Engine (falling cake chunks)
                triggerPhysicsExplosion();

                // 3. Kitties rise up from inside the bottom layer
                setTimeout(() => {
                    kitties.classList.add('rise-up');
                    playSynthMusic();
                }, 300); // slight delay after explosion

            }, 1500);
        }

        // --- 4. Canvas Physics Engine (Cake Chunks) ---
        function triggerPhysicsExplosion() {
            const canvas = document.getElementById('physics-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const chunks = [];
            const colors = ['#ff80ab', '#ffffff', '#ba68c8', '#ab47bc', '#ffea00'];

            // Create 80 chunks of cake
            for (let i = 0; i < 80; i++) {
                chunks.push({
                    x: canvas.width / 2, // Start in middle of cake
                    y: canvas.height / 2 - 50,
                    vx: (Math.random() - 0.5) * 20, // Explosive outward force
                    vy: (Math.random() - 0.5) * 15 - 10, // Upward arc
                    size: Math.random() * 10 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 20
                });
            }

            const tableY = canvas.height - 40; // The virtual floor (table)

            function animateChunks() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let isMoving = false;

                chunks.forEach(p => {
                    // Apply Gravity
                    p.vy += 0.8; 
                    
                    // Move
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.rotationSpeed;

                    // Table Collision (Bounce & Friction)
                    if (p.y > tableY) {
                        p.y = tableY;
                        p.vy *= -0.4; // Lose energy on bounce
                        p.vx *= 0.6; // Friction slows horizontal movement
                        p.rotationSpeed *= 0.5;
                    }

                    // Keep rendering if things are still moving
                    if (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) {
                        isMoving = true;
                    }

                    // Draw Chunk
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                });

                if (isMoving) {
                    requestAnimationFrame(animateChunks);
                }
            }
            animateChunks();
        }

        // --- 5. Sound ---
        function playSynthMusic() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            // A simple festive chord progression
            [264, 330, 396].forEach((freq, index) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.1 + (index*0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 3);
            });
        }
    </script>
</body>
</html>
